  /api/admin/access-requests/{owner}/{sitename}/revoke:
    post:
      summary: Take a site off the network
      description: Admin only, browser session only (never an API key). Sets the site to `company`, so signed-in people keep the link. Audited as `network_access_reverted`. `409` when the site is not open to the network.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/sitename'
      responses:
        '200':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
