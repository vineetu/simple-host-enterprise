  /api/access:
    get:
      summary: Read a site's access log
      description: |
        A non-admin must pass `owner` (their own username or a team they are
        in). What comes back depends on `ACCESS_LOG_VISIBILITY`: under
        `counts` (the default) a non-admin gets `AccessCounts` — views per
        day and distinct viewers, the last 30 days unless `from`/`to` say
        otherwise, never who; under `owner` they get rows with user ids but
        no IP or user agent; under `admin` they are refused. Admins always
        get full rows. API-key callers send `X-Skill-Version` as on the other
        management routes.
      tags: [Audit]
      security:
        - apiKey: []
      parameters:
        - name: owner
          in: query
          schema:
            type: string
        - name: site
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Aggregates under `counts` for a non-admin; otherwise a page of rows
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AccessCounts'
                  - type: object
                    properties:
                      entries:
                        type: array
                        items:
                          type: object
                      next_cursor:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/access-requests/{owner}/{sitename}/approve:
    post:
