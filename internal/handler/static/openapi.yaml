  /api/collaboration/sites/{owner}/{sitename}/access:
    post:
      summary: Set who can open an owner-qualified site
      description: |
        Owner/member operation. Same as `POST /api/sites/{sitename}/access`, for a
        site in a team's namespace.
        Sets who can open the site. Any level except `network` takes effect at
        once; moving off `network` ends its approval, and moving to any level
        withdraws a pending network request. `network` needs a `reason` (at
        most 500 characters) and returns `202`: the site keeps its level until
        an admin approves the request. The site's address does not change;
        add viewers for `specific` through the viewers routes.
      tags: [Collaboration]
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/SkillVersion'
        - $ref: '#/components/parameters/SimpleHostClient'
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/sitename'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteAccessRequest'
      responses:
        '200':
          description: Access level changed
          headers:
            ETag:
              $ref: '#/components/headers/SiteETag'
            X-Simple-Host-Latest-Skill-Version:
              $ref: '#/components/headers/LatestSkillVersion'
            X-Simple-Host-Minimum-Skill-Version:
              $ref: '#/components/headers/MinimumSkillVersion'
            X-Simple-Host-Update-URL:
              $ref: '#/components/headers/SkillUpdateURL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAccessResponse'
        '202':
          description: Network access requested; the site keeps its current level until an admin approves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAccessResponse'
        '400':
          $ref: '#/components/responses/ManagementBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The site is already open to the network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

