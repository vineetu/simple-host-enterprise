      description: Admin only, browser session only (never an API key). Opens the site to anyone who can reach the server. Audited as `network_access_approved`. `409` when nothing is pending.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/sitename'
      responses:
        '200':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Nothing to approve, decline or revoke
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/access-requests/{owner}/{sitename}/decline:
    post:
      summary: Decline a network access request
      description: Admin only, browser session only (never an API key). The site keeps its current level. Audited as `network_access_declined`. `409` when nothing is pending.
      tags: [Admin]
      parameters:
