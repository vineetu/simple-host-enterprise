openapi: 3.0.3
info:
  title: Simple Host API
  description: |
    Internal static website hosting. Every site is served at the root of its
    own host, `<sitename>.<owner>.<base>/` (for example
    `todo.alice.example.com/`). The owner host `<owner>.<base>/` serves the
    person's or team's index page. Until the owner's certificate is ready it
    also serves their sites at `<owner>.<base>/<sitename>/`; after that,
    those addresses redirect to each site's own host. Always use the `url`
    from the latest response rather than composing an address. Uploads may
    be gzip-compressed tar or ZIP archives; nested regular-file downloads such
    as ZIP and DMG artifacts are supported.

    A site is owned by a person or a team. Team members change a team's
    sites through owner-qualified collaboration routes with optimistic
    `ETag` / `If-Match` protection.

    Every site has an access level: `only_me` (the owner, or the team's
    members; the default for a new site), `specific` (plus named viewers),
    `company` (anyone signed in with the link),
    `listed` (company, plus showcase and search), or `network` (anyone who
    can reach the server, no sign-in). `network` is requested with a reason
    and applies only once an admin approves it; anonymous visitors can read a
    network site's pages, assets and state, and change nothing.

    Shared state and uploaded files are served on each site's own host and
    need a signed-in viewer (or an API key); anyone who may open a site may
    read and write its state. The last 20 versions of each site's state are
    kept and the owner or team can restore one. The control pages and management API live on
    the base host, never on a site's host. Never store secrets or PII in state
    or uploaded files.

    Rate-limited operations return `429` with an integer-seconds
    `Retry-After` header. These limits are process-local and reset when the
    service process restarts.

    API-key-authenticated management requests must identify either a supported
    agent skill with `X-Skill-Version: <major.minor.patch>` or an intentional
    non-skill integration with `X-Simple-Host-Client: api`. The first-party
    account page uses the reserved `control-ui` value. Missing, malformed, or
    unsupported skill versions return `400 skill_version_required` after valid
    authentication; invalid keys still return `401`. Accepted management
    responses advertise latest/minimum/update metadata in headers without
    changing response bodies.

    The public, unauthenticated `/.well-known/agent-skills/` namespace exposes
    only the discovery index and three fixed skill archives documented below.
    `GET` or `HEAD` for any other artifact in that namespace returns a fixed
    `404 Not Found`; methods other than `GET` and `HEAD` on a fixed discovery
    path return `405 Method Not Allowed`. The SHA-256 digests are integrity
    checks over the exact same-origin archive bytes, not signatures.
  version: 2.5.0

servers:
  - url: https://simple-host.example.com
    description: Production
  - url: http://localhost:8080
    description: Local development

paths:
  /.well-known/agent-skills/index.json:
    description: Public, unauthenticated fixed discovery-index path. Methods other than GET and HEAD return 405 Method Not Allowed.
    get:
      operationId: getAgentSkillsDiscoveryIndex
      summary: Get the agent skill discovery index
      description: Returns the draft discovery document and its three fixed archive entries. The response body is non-empty JSON.
      tags: [Skills]
      security: []
      responses:
        '200':
          $ref: '#/components/responses/AgentSkillsDiscoveryIndexGET'
    head:
      operationId: headAgentSkillsDiscoveryIndex
      summary: Get agent skill discovery index headers
      description: 'Returns the same 200 status, `Content-Type: application/json`, `Cache-Control`, and `Content-Length` headers as GET, with no response body.'
      tags: [Skills]
      security: []
      responses:
        '200':
          $ref: '#/components/responses/AgentSkillsDiscoveryIndexHEAD'

  /.well-known/agent-skills/simple-host.zip:
    description: Public, unauthenticated fixed archive path. Methods other than GET and HEAD return 405 Method Not Allowed; unlisted artifacts under the discovery namespace return 404 Not Found.
    get:
      operationId: getSimpleHostAgentSkillArchive
      summary: Download the simple-host skill archive
      description: Returns the non-empty ZIP archive whose exact bytes are hashed by the matching discovery entry.
      tags: [Skills]
      security: []
      responses:
        '200':
          $ref: '#/components/responses/AgentSkillArchiveGET'
    head:
      operationId: headSimpleHostAgentSkillArchive
      summary: Get simple-host skill archive headers
      description: 'Returns the same 200 status, `Content-Type: application/zip`, `Cache-Control`, and `Content-Length` headers as GET, with no response body.'
      tags: [Skills]
      security: []
      responses:
        '200':
          $ref: '#/components/responses/AgentSkillArchiveHEAD'

  /.well-known/agent-skills/simple-host-builder.zip:
    description: Public, unauthenticated fixed archive path. Methods other than GET and HEAD return 405 Method Not Allowed; unlisted artifacts under the discovery namespace return 404 Not Found.
    get:
      operationId: getSimpleHostBuilderAgentSkillArchive
      summary: Download the simple-host-builder skill archive
      description: Returns the non-empty ZIP archive whose exact bytes are hashed by the matching discovery entry.
      tags: [Skills]
      security: []
      responses:
        '200':
          $ref: '#/components/responses/AgentSkillArchiveGET'
    head:
      operationId: headSimpleHostBuilderAgentSkillArchive
      summary: Get simple-host-builder skill archive headers
      description: 'Returns the same 200 status, `Content-Type: application/zip`, `Cache-Control`, and `Content-Length` headers as GET, with no response body.'
      tags: [Skills]
      security: []
      responses:
        '200':
          $ref: '#/components/responses/AgentSkillArchiveHEAD'

  /.well-known/agent-skills/fix-paths-for-subpath-hosting.zip:
    description: Public, unauthenticated fixed archive path. Methods other than GET and HEAD return 405 Method Not Allowed; unlisted artifacts under the discovery namespace return 404 Not Found.
    get:
      operationId: getFixPathsForSubpathHostingAgentSkillArchive
      summary: Download the fix-paths-for-subpath-hosting skill archive
      description: Returns the non-empty ZIP archive whose exact bytes are hashed by the matching discovery entry.
      tags: [Skills]
      security: []
      responses:
        '200':
          $ref: '#/components/responses/AgentSkillArchiveGET'
    head:
      operationId: headFixPathsForSubpathHostingAgentSkillArchive
      summary: Get fix-paths-for-subpath-hosting skill archive headers
      description: 'Returns the same 200 status, `Content-Type: application/zip`, `Cache-Control`, and `Content-Length` headers as GET, with no response body.'
      tags: [Skills]
      security: []
      responses:
        '200':
          $ref: '#/components/responses/AgentSkillArchiveHEAD'

  /skills/sha256/{digest}/skills.zip:
    get:
      summary: Download a bundle by content digest
      description: Serves the skill bundle only when {digest} is the SHA-256 of the bundle this deployment produces; any other digest returns 404. Because the URL names the bytes, the response is safely cacheable forever. Read immutable_bundle_url from /skills/version rather than constructing this path.
      tags: [Skills]
      security: []
      parameters:
        - name: digest
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
      responses:
        '200':
          description: The bundle matching this digest
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [public, max-age=31536000, immutable]
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          description: No deployed bundle has this digest. Not cached, since a later deployment may serve it.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]

  /skills/version:
    get:
      summary: Get the current skill bundle manifest
      description: Publishes metadata for a permissioned, SHA-256-verified skill update. The checksum is an integrity check from the same origin, not a code-signing signature.
      tags: [Skills]
      security: []
      responses:
        '200':
          description: Current bundle manifest
          headers:
            Cache-Control:
              description: Prevents caching across skill releases.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillVersionManifest'

  /api/me:
    get:
      summary: Get current user info
      tags: [Auth]
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/SkillVersion'
        - $ref: '#/components/parameters/SimpleHostClient'
      responses:
        '200':
          description: Current user
          headers:
            X-Simple-Host-Latest-Skill-Version:
              $ref: '#/components/headers/LatestSkillVersion'
            X-Simple-Host-Minimum-Skill-Version:
              $ref: '#/components/headers/MinimumSkillVersion'
            X-Simple-Host-Update-URL:
              $ref: '#/components/headers/SkillUpdateURL'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  is_admin:
                    type: boolean
                  usage:
                    type: array
                    description: Each namespace's sites and stored bytes against its quota (own first, then each team's). A max of 0 is unlimited.
                    items:
                      type: object
                      properties:
                        owner: {type: string}
                        sites: {type: integer}
                        max_sites: {type: integer}
                        bytes: {type: integer}
                        max_bytes: {type: integer}
        '400':
          $ref: '#/components/responses/SkillVersionRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/sites:
    get:
      summary: List sites
      description: Returns the authenticated user's sites with daily server-side analytics. Admins see all sites.
      tags: [Sites]
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/SkillVersion'
        - $ref: '#/components/parameters/SimpleHostClient'
      responses:
        '200':
          description: List of sites
          headers:
            X-Simple-Host-Latest-Skill-Version:
              $ref: '#/components/headers/LatestSkillVersion'
            X-Simple-Host-Minimum-Skill-Version:
              $ref: '#/components/headers/MinimumSkillVersion'
            X-Simple-Host-Update-URL:
              $ref: '#/components/headers/SkillUpdateURL'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/SkillVersionRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/sites/{sitename}:
    post:
      summary: Create a new site
      description: |
        Upload a gzip-compressed tar or ZIP archive. The compressed request is
        limited to 100 MiB; each regular file and all files in aggregate are
        limited to 500 MiB of bytes actually read; at most 50,000 entries are
        accepted. Complete gzip/TAR output is independently limited to 768 MiB,
        including framing, extended metadata, padding, and trailing bytes;
        unique path-tracking metadata is limited to 64 MiB. Entries must be
        regular files or directories with canonical, confined paths. Symlinks
        and special files are rejected.

        Extensions use a denylist, not an allowlist: `.sh`, `.bash`, `.zsh`,
        `.fish`, `.bat`, `.cmd`, `.ps1`, `.py`, `.pyc`, `.rb`, `.pl`, `.go`,
        `.php`, and `.exe` are rejected case-insensitively. Other regular files,
        including nested ZIP and DMG downloads, are supported, except entries
        whose basename is `.DS_Store` or starts with `._`; those macOS metadata
        files are omitted. The response's `url` is the site's address: the
        root of its own host `<sitename>.<owner>.<base>/`, or for a short while
        after an owner's first site `<owner>.<base>/<sitename>/`. Use it as
        returned rather than composing it by hand, and take it from the latest
        response. A new site's access level is `only_me`.

        A new site's name becomes its address: lowercase letters, digits and
        hyphens, starting and ending with a letter or digit, at most
        63 characters, and not starting with `xn--`. Any other name is
        refused with `400 invalid_site_name`. A name equal to the address of
        one of the owner's older sites (for example `notes` beside an older
        `Notes`) is refused with `409 name_conflict`.
      tags: [Sites]
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/SkillVersion'
        - $ref: '#/components/parameters/SimpleHostClient'
        - $ref: '#/components/parameters/sitename'
      requestBody:
        required: true
        content:
          application/gzip:
            schema:
              type: string
              format: binary
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Site created
          headers:
            X-Simple-Host-Latest-Skill-Version:
              $ref: '#/components/headers/LatestSkillVersion'
            X-Simple-Host-Minimum-Skill-Version:
              $ref: '#/components/headers/MinimumSkillVersion'
            X-Simple-Host-Update-URL:
              $ref: '#/components/headers/SkillUpdateURL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteWithNote'
        '400':
          $ref: '#/components/responses/ManagementBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Site already exists, or `name_conflict` (the name equals the address of one of the owner's older sites)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Compressed archive request exceeds 100 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    put:
      summary: Update an existing site
      description: Upload a new gzip-compressed tar or ZIP version using the same archive safety, type, path, denylist, and size/count limits as site creation. Creates a new version number. Versions beyond the newest 5 are automatically cleaned up. `If-Match` is optional here, since only the owner deploys a site in their own namespace; team sites use the owner-qualified route, where it is required.
      tags: [Sites]
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/SkillVersion'
        - $ref: '#/components/parameters/SimpleHostClient'
        - $ref: '#/components/parameters/sitename'
        - name: If-Match
          in: header
          required: false
          description: Optional on this route; send the ETag captured before editing.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/gzip:
            schema:
              type: string
              format: binary
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Site updated
          headers:
            X-Simple-Host-Latest-Skill-Version:
              $ref: '#/components/headers/LatestSkillVersion'
            X-Simple-Host-Minimum-Skill-Version:
              $ref: '#/components/headers/MinimumSkillVersion'
            X-Simple-Host-Update-URL:
              $ref: '#/components/headers/SkillUpdateURL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteWithNote'
        '400':
          $ref: '#/components/responses/ManagementBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Site not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          description: Compressed archive request exceeds 100 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    delete:
      summary: Delete a site
      description: Deletes the site and all its versions from disk and database.
      tags: [Sites]
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/SkillVersion'
        - $ref: '#/components/parameters/SimpleHostClient'
        - $ref: '#/components/parameters/sitename'
      responses:
        '204':
          description: Site deleted
          headers:
            X-Simple-Host-Latest-Skill-Version:
              $ref: '#/components/headers/LatestSkillVersion'
            X-Simple-Host-Minimum-Skill-Version:
              $ref: '#/components/headers/MinimumSkillVersion'
            X-Simple-Host-Update-URL:
              $ref: '#/components/headers/SkillUpdateURL'
        '400':
          $ref: '#/components/responses/SkillVersionRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Site not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/sites/{sitename}/versions:
    get:
      summary: List versions
      description: Returns all versions of a site, newest first.
      tags: [Sites]
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/SkillVersion'
        - $ref: '#/components/parameters/SimpleHostClient'
        - $ref: '#/components/parameters/sitename'
      responses:
        '200':
          description: List of versions
          headers:
            X-Simple-Host-Latest-Skill-Version:
              $ref: '#/components/headers/LatestSkillVersion'
            X-Simple-Host-Minimum-Skill-Version:
              $ref: '#/components/headers/MinimumSkillVersion'
            X-Simple-Host-Update-URL:
              $ref: '#/components/headers/SkillUpdateURL'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/SkillVersionRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Site not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sites/{sitename}/rollback:
    post:
      summary: Rollback to a previous version
      description: Rollback a site to a specific version. The version must exist on disk and in the database. `If-Match` is optional on this route.
      tags: [Sites]
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/SkillVersion'
        - $ref: '#/components/parameters/SimpleHostClient'
        - $ref: '#/components/parameters/sitename'
        - name: If-Match
          in: header
          required: false
          description: Optional on this route; send the ETag captured before editing.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  minimum: 1
                  example: 1
      responses:
        '200':
          description: Rollback successful
          headers:
            X-Simple-Host-Latest-Skill-Version:
              $ref: '#/components/headers/LatestSkillVersion'
            X-Simple-Host-Minimum-Skill-Version:
              $ref: '#/components/headers/MinimumSkillVersion'
            X-Simple-Host-Update-URL:
              $ref: '#/components/headers/SkillUpdateURL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/ManagementBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Site or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          description: Request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/sites/{sitename}/access:
    post:
      summary: Set who can open a site
      description: |
        Sets who can open the site. Any level except `network` takes effect at
        once; moving off `network` ends its approval, and moving to any level
        withdraws a pending network request. `network` needs a `reason` (at
        most 500 characters) and returns `202`: the site keeps its level until
        an admin approves the request. The site's address does not change;
        add viewers for `specific` through the viewers routes.
      tags: [Sites]
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/SkillVersion'
        - $ref: '#/components/parameters/SimpleHostClient'
        - $ref: '#/components/parameters/sitename'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteAccessRequest'
      responses:
        '200':
          description: Access level changed
          headers:
            ETag:
              $ref: '#/components/headers/SiteETag'
            X-Simple-Host-Latest-Skill-Version:
              $ref: '#/components/headers/LatestSkillVersion'
            X-Simple-Host-Minimum-Skill-Version:
              $ref: '#/components/headers/MinimumSkillVersion'
            X-Simple-Host-Update-URL:
              $ref: '#/components/headers/SkillUpdateURL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAccessResponse'
        '202':
          description: Network access requested; the site keeps its current level until an admin approves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAccessResponse'
        '400':
          $ref: '#/components/responses/ManagementBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The site is already open to the network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/collaboration/sites:
    get:
      summary: List owned and team sites
      description: |
        Returns canonical sites the authenticated user owns or that belong to
        a team the user is in. Legacy `GET /api/sites` remains owned-only for
        normal users.
      tags: [Collaboration]
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/SkillVersion'
        - $ref: '#/components/parameters/SimpleHostClient'
      responses:
        '200':
          description: Owned and team sites
          headers:
            X-Simple-Host-Latest-Skill-Version:
              $ref: '#/components/headers/LatestSkillVersion'
            X-Simple-Host-Minimum-Skill-Version:
              $ref: '#/components/headers/MinimumSkillVersion'
            X-Simple-Host-Update-URL:
              $ref: '#/components/headers/SkillUpdateURL'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollaborationSite'
        '400':
          $ref: '#/components/responses/SkillVersionRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/collaboration/sites/{owner}/{sitename}:
    get:
      summary: Get an accessible canonical site
      description: Resolves the owner-qualified site and the caller's owner/member role.
      tags: [Collaboration]
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/SkillVersion'
        - $ref: '#/components/parameters/SimpleHostClient'
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/sitename'
      responses:
        '200':
          description: Accessible site metadata
          headers:
            ETag:
              $ref: '#/components/headers/SiteETag'
            X-Simple-Host-Latest-Skill-Version:
              $ref: '#/components/headers/LatestSkillVersion'
            X-Simple-Host-Minimum-Skill-Version:
              $ref: '#/components/headers/MinimumSkillVersion'
            X-Simple-Host-Update-URL:
              $ref: '#/components/headers/SkillUpdateURL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollaborationSite'
        '400':
          $ref: '#/components/responses/SkillVersionRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      summary: Deploy a new canonical-site version
      description: |
        Owner/member operation. Uploads a complete gzip-compressed TAR or ZIP
        artifact under the resource owner's existing namespace. Capture the
        ETag before editing and send it in `If-Match`; never refresh the ETag
        immediately before uploading a stale local snapshot. A stale validator
        returns 412 and must be reconciled deliberately.
      tags: [Collaboration]
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/SkillVersion'
        - $ref: '#/components/parameters/SimpleHostClient'
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/sitename'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/gzip:
            schema:
              type: string
              format: binary
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Version deployed
          headers:
            ETag:
              $ref: '#/components/headers/SiteETag'
            X-Simple-Host-Latest-Skill-Version:
              $ref: '#/components/headers/LatestSkillVersion'
            X-Simple-Host-Minimum-Skill-Version:
              $ref: '#/components/headers/MinimumSkillVersion'
            X-Simple-Host-Update-URL:
              $ref: '#/components/headers/SkillUpdateURL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollaborationSite'
        '400':
