<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My sites</title><style>__STYLE__</style></head>
<body data-dashboard="__DASHBOARD__"><header class="appbar"><strong>Simple Host</strong><span id="view-label">My sites</span></header>
<main class="appbody my-sites">
<section id="site-list"><input id="search" class="search" type="search" placeholder="Search sites" aria-label="Search sites"><div id="rows"></div><p id="list-status" class="status" role="status">Loading sites…</p></section>
<section id="dashboard" hidden><button id="back" class="text-button" type="button">‹ My sites</button><h1 id="site-name" class="site-selected"></h1>
<div class="dashboard-grid"><section class="metric" aria-label="Visitors"><h2><span id="visitor-count">…</span><span class="metric-label">visitors this week</span></h2><div id="chart" class="chart" role="img" aria-label="Daily visitors over the last seven UTC days"></div><p id="analytics-error" role="status"></p></section>
<section id="entries" class="entries" hidden><h2 id="entries-title">Latest entries</h2><div id="entry-rows"></div></section></div>
<p id="entries-error" role="status"></p>
<div class="actions"><button id="open-site" class="primary" type="button">Open site</button></div><p id="link-error" role="status"></p>
</section></main><script>__BRIDGE__</script><script>__SCREEN__</script></body></html>
