# Publish the Helm chart in deploy/helm as an OCI artifact at
# oci://ghcr.io/<owner>/charts/simple-host-enterprise. A tag chart-v<version>
# on a commit in main publishes the chart whose Chart.yaml carries that
# version, once: a version already published is never replaced. The chart is
# signed like the image (verify with cosign, as INSTALL.md section 3 does).
name: chart

on:
  push:
    tags: ["chart-v*"]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  HELM_VERSION: v3.19.0
  HELM_SHA256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496
  CHART_DIR: deploy/helm/simple-host-enterprise

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "${GITHUB_REF_NAME} is not on main"; exit 1; }
      - name: Install Helm
        run: |
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm && sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Tag matches Chart.yaml
        run: |
          version="$(awk '/^version:/{print $2}' "$CHART_DIR/Chart.yaml")"
          test "chart-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match chart version ${version}"; exit 1; }
      - run: helm lint "$CHART_DIR"
      - run: helm package "$CHART_DIR" -d dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Push and sign
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          ref="ghcr.io/${owner}/charts/simple-host-enterprise"
          version="${GITHUB_REF_NAME#chart-v}"
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          echo "$TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          if helm show chart "oci://${ref}" --version "$version" > /dev/null 2>&1; then
            echo "chart ${version} is already published; bump version in Chart.yaml"; exit 1
          fi
          helm push dist/*.tgz "oci://ghcr.io/${owner}/charts" 2>&1 | tee push.log
          digest="$(awk '/^Digest:/{print $2}' push.log)"
          test -n "$digest"
          cosign sign --yes "${ref}@${digest}"
          {
            echo "Chart ${version}: \`${ref}@${digest}\`"
            echo "Install: \`helm install simple-host oci://${ref} --version ${version} -n simple-host --create-namespace\`"
          } >> "$GITHUB_STEP_SUMMARY"
