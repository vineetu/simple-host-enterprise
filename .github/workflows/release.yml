# Publish the container image so an installation does not begin with "build
# your own". Multi-arch because the clusters this lands on are a mix: AKS and
# EKS default to amd64, Graviton and Ampere node pools are arm64, and an
# installer should not have to know which they have.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (defaults to the commit SHA)"
        required: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The tests are the gate. An image nobody ran the suite against is worse
      # than no image, because it looks official.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test ./...

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          # No floating tag: an install pins a digest, and a `latest` that moves
          # under it is exactly what the digest exists to prevent.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || github.sha }}
            COMMIT=${{ github.sha }}

      # Keyless: the signature is bound to this workflow's GitHub OIDC
      # identity, so `cosign verify` proves the image came from this
      # repository's release workflow and not merely from someone with push
      # access to the registry. INSTALL.md has the verify command.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the image
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      # The digest is what the overlays pin. Printing it in the summary means
      # an installer copies it from the run rather than hunting in a registry.
      - name: Digest to pin
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Set this in your overlay'"'"'s `kustomization.yaml`:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          echo 'images:' >> $GITHUB_STEP_SUMMARY
          echo '  - name: ghcr.io/${{ github.repository }}' >> $GITHUB_STEP_SUMMARY
          echo '    newName: ghcr.io/${{ github.repository }}' >> $GITHUB_STEP_SUMMARY
          echo '    digest: ${{ steps.build.outputs.digest }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
