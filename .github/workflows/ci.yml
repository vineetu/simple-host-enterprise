name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres, so the tests gated on MIGRATE_TEST_DSN run here rather
    # than skipping. Same image `make test-db` uses.
    services:
      postgres:
        image: postgres:16.11@sha256:468e1f126ca5af849799cda06ac9b03d8090aae9fa5163408b3e8da44fad0702
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - run: go vet ./...
      - name: go test (with Postgres; fails if a DB test skips)
        env: {MIGRATE_TEST_DSN: "postgres://test:test@localhost:5432/test?sslmode=disable"}
        run: ./scripts/test-db.sh
      - run: ./scripts/check-features.sh
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Every overlay must render. A kustomization that only builds on the
      # author's machine is found by the first person to try it, which is the
      # worst possible time.
      - name: Render every overlay
        run: |
          # A pinned release, checked against its published sha256, not a
          # script fetched from a moving branch.
          v=5.8.1; sum=029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
          curl -sSLo kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${v}/kustomize_v${v}_linux_amd64.tar.gz"
          echo "${sum}  kustomize.tgz" | sha256sum -c -
          tar -xzf kustomize.tgz kustomize
          for o in deploy/overlays/*/; do
            name=$(basename "$o")
            [ -f "$o/kustomization.yaml" ] || continue
            # Overlays legitimately require operator-supplied files. One with
            # no .example of its own (staging, production) is the byo shape,
            # so byo's stands in.
            for f in config.env secrets.env; do
              [ -f "$o/$f" ] && continue
              if [ -f "$o/$f.example" ]; then cp "$o/$f.example" "$o/$f"; else cp "deploy/overlays/byo/$f.example" "$o/$f"; fi
            done
            [ -f "$o/kustomization.yaml" ] && grep -q db-ca.crt "$o/kustomization.yaml" && echo placeholder > "$o/db-ca.crt"
            echo "== $name"
            ./kustomize build "$o" > /dev/null || { echo "FAILED to render $name"; exit 1; }
          done
