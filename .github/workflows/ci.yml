name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - uses: golang/govulncheck-action@v1
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every overlay must render. A kustomization that only builds on the
      # author's machine is found by the first person to try it, which is the
      # worst possible time.
      - name: Render every overlay
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          for o in deploy/overlays/*/; do
            name=$(basename "$o")
            [ -f "$o/kustomization.yaml" ] || continue
            # Overlays legitimately require operator-supplied files.
            [ -f "$o/config.env.example" ] && cp -n "$o/config.env.example" "$o/config.env" 2>/dev/null || true
            [ -f "$o/secrets.env.example" ] && cp -n "$o/secrets.env.example" "$o/secrets.env" 2>/dev/null || true
            [ -f "$o/kustomization.yaml" ] && grep -q db-ca.crt "$o/kustomization.yaml" && echo placeholder > "$o/db-ca.crt"
            echo "== $name"
            ./kustomize build "$o" > /dev/null || { echo "FAILED to render $name"; exit 1; }
          done
