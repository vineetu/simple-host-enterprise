# Syncs every site's assets directory to the backup bucket (design 9.1),
# under the same server-side-encryption header and optional client-side
# envelope a version backup uses. Runs `simple-host backup-assets`, which is
# safe to run concurrently with itself or with a deploy: every file is
# re-uploaded, never deleted, and the site tree is only ever read.
#
# The schedule is a starting point, not a design decision; an overlay with a
# real asset volume can patch it to whatever cadence its recovery-point
# objective needs.
#
# The read-only mount below is the site-data PVC design section 3 already
# assumes is ReadWriteOnce, one node, one replica. On a single-node cluster
# (the local overlay) that is automatically also this Job's node, so it
# mounts cleanly alongside the application Deployment's read-write mount. On
# a multi-node cluster, a second node attaching the same RWO volume can fail
# depending on the CSI driver, so a production overlay whose nodes span more
# than one host should pin this CronJob's pod to the application's node with
# a nodeAffinity/nodeSelector, or move site-data to a ReadWriteMany class,
# before relying on this job. Recorded, not solved here: it is an overlay
# concern, not something the base manifest can decide.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: simple-host-backup-assets
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: simple-host
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup-assets
              image: simple-host
              args: ["backup-assets"]
              envFrom:
                - configMapRef:
                    name: simple-host-config
                - secretRef:
                    name: simple-host-secrets
              volumeMounts:
                - name: site-data
                  mountPath: /mnt/data
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 250m, memory: 256Mi }
          volumes:
            - name: site-data
              persistentVolumeClaim:
                claimName: simple-host-site-data
                readOnly: true
            - name: tmp
              emptyDir: {}
