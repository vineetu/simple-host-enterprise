apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-host
  labels:
    app: simple-host
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: simple-host
  # Pods are stateless: sites live in the bucket and the database decides
  # which version is live (docs/storage.md), so a rollout starts the new pod
  # before it stops an old one and never drops below the replica count.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: simple-host
    spec:
      serviceAccountName: simple-host
      automountServiceAccountToken: false
      # One replica per node when there are several. Counted per revision
      # (pod-template-hash), so a surge pod never waits on the old pods and
      # the new ones always end up on different nodes; a single-node cluster
      # has one domain and still runs both. Cordoned and unreachable nodes
      # are not counted (nodeTaintsPolicy: Honor), so a drain, or a lost node
      # on a two-node cluster, puts the replacement on the remaining node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys: ["pod-template-hash"]
          labelSelector:
            matchLabels:
              app: simple-host
      # 10 s preStop sleep, then up to 30 s for in-flight requests.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Same image, other mode. Takes an advisory lock, applies pending
        # migrations in order, exits. The server then refuses to start unless
        # the schema is exactly what it embeds.
        - name: migrate
          image: simple-host
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: simple-host-config
          env:
            # Only the database secrets, one key each: migrate never needs
            # the OIDC, session, bucket or envelope keys. DB_PASSWORD (or a
            # DB_DSN kept in the Secret) is the owning role migrations run
            # as; DB_APP_PASSWORD is the application role's target password,
            # set on the role migration 0020 creates.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: simple-host-secrets
                  key: DB_PASSWORD
                  optional: true
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: simple-host-secrets
                  key: DB_DSN
                  optional: true
            - name: DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: simple-host-secrets
                  key: DB_APP_PASSWORD
          volumeMounts:
            - name: db-ca
              mountPath: /etc/simple-host/db-ca
              readOnly: true
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
      containers:
        - name: simple-host
          image: simple-host
          ports:
            - name: application
              containerPort: 8080
            - name: redirect
              containerPort: 8081
            # Prometheus /metrics. Deliberately absent from the Service, so
            # the Ingress cannot route to it; scrape the pod directly.
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: simple-host-config
            - secretRef:
                name: simple-host-secrets
          env:
            # The server connects as the least-privilege application role:
            # DB_APP_USER makes it use DB_APP_PASSWORD (or
            # DB_APP_PASSWORD_FILE) from simple-host-secrets, whatever
            # DB_USER/DB_PASSWORD(_FILE) say, and it refuses to start if the
            # role it gets can alter audit_events. DB_PASSWORD is blanked so
            # the owning role's password is not in this container's
            # environment at all.
            - name: DB_APP_USER
              value: simplehost_app
            - name: DB_PASSWORD
              value: ""
          volumeMounts:
            - name: cache
              mountPath: /var/cache/simple-host
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /etc/simple-host/db-ca
              readOnly: true
          securityContext: *containerSecurity
          # Keep serving while the ingress controller and kube-proxy drop this
          # pod from their endpoints; without it a rollout sends requests to
          # a closed listener (connect timeouts at the ingress). The native
          # sleep action needs no shell in the image; Kubernetes 1.30+.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          startupProbe:
            httpGet: { path: /healthz, port: application }
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /healthz, port: application }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: application }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            # internal/tarball now checks each entry's declared size against
            # the 500 MiB per-file/aggregate cap before
            # allocating or decompressing it (checkDeclaredSize), so a
            # refused entry costs no allocation and an accepted one is
            # allocated exactly once at its own declared size — the earlier
            # 3Gi bump here was masking that bug (an oversized entry was
            # fully read into memory before being refused), not sizing for
            # legitimate traffic; see docs/security-review.md's
            # "Reviewer findings / archive limits". One legitimate upload's
            # worst case is now ~500MB (one accepted entry at the per-file
            # cap) plus the ~100MB compressed request body readLimitedBody
            # holds, and Go's GC commonly runs at ~2x live heap before
            # collecting. 2Gi covers that with headroom for the second of
            # the two concurrent upload slots abuse_limits.go allows; it
            # does not cover two simultaneous worst-case uploads landing in
            # the same GC window, which is a capacity-planning question for
            # an installation's real traffic, not this limit's job. Cache
            # fills stream to the cache volume; with the envelope on they
            # buffer the object instead, capped at 1 GiB per pod in total
            # (internal/storage/budget.go). A worst-case enveloped fill
            # landing alongside two worst-case uploads exceeds 2Gi; raise
            # the limit if real traffic has both.
            limits: { cpu: "1", memory: 2Gi }
      volumes:
        # Pod-local cache of site versions (CACHE_DIR), emptied on start.
        # CACHE_MAX_BYTES bounds unpinned entries only; versions being served
        # stay pinned, and a fill in progress downloads its compressed
        # archive here first, hence the headroom.
        - name: cache
          emptyDir:
            sizeLimit: 3Gi
        # Multipart asset uploads spill here.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        # The database server's CA, for sslmode=verify-full. A component that
        # runs Postgres in the cluster points this at the certificate it
        # issued; a managed database's bundle is supplied by the overlay.
        # Optional so an overlay that relies on the system bundle still starts.
        - name: db-ca
          secret:
            secretName: simple-host-db-ca
            optional: true
