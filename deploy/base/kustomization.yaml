apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The application and nothing else: an overlay supplies the environment's
# config.env and secrets.env (as simple-host-config and simple-host-secrets),
# the ingress hosts, the image, and, through components, a database and a
# bucket or the coordinates of managed ones.
namespace: simple-host

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - backup-assets-cronjob.yaml
  - cronjob-prune.yaml

# Fully qualified, and a digest that is deliberately not one: an overlay that
# forgets to pin the image fails `make preflight` rather than pulling
# whatever an unqualified `simple-host:latest` resolves to on some registry.
images:
  - name: simple-host
    newName: ghcr.io/vineetu/simple-host-enterprise
    digest: sha256:REPLACE_WITH_THE_RELEASE_DIGEST
