{{- /*
One Postgres in this namespace for trying Simple Host out, serving TLS from a
private CA cert-manager issues, so the server connects with verify-full. No
replicas and no backups: the server logs a warning at every start while it is
in use. Use postgres.mode=external for anything real.
*/ -}}
{{- if eq .Values.postgres.mode "incluster" }}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" .Values.postgres.incluster.image) }}{{ fail "postgres.incluster.image must be pinned by digest" }}{{ end }}
{{- $ns := .Release.Namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  labels: {{- include "sh.labels" . | nindent 4 }}
data:
  # TLS or nothing over the network; the socket inside the pod is for the
  # image's own init and health check.
  pg_hba.conf: |
    local   all  all                trust
    hostssl all  all  0.0.0.0/0     scram-sha-256
    hostssl all  all  ::/0          scram-sha-256
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: postgres-selfsigned
  labels: {{- include "sh.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-ca
  labels: {{- include "sh.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: simple-host postgres CA
  secretName: postgres-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: postgres-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: postgres-ca
  labels: {{- include "sh.labels" . | nindent 4 }}
spec:
  ca:
    secretName: postgres-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-server
  labels: {{- include "sh.labels" . | nindent 4 }}
spec:
  secretName: postgres-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    rotationPolicy: Always
  dnsNames:
    - postgres
    - postgres.{{ $ns }}
    - postgres.{{ $ns }}.svc
    - postgres.{{ $ns }}.svc.cluster.local
  usages:
    - server auth
  issuerRef:
    name: postgres-ca
    kind: Issuer
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "sh.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
    {{- include "sh.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      {{- include "sh.scheduling" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.incluster.image }}
          args: ["-c", "ssl=on", "-c", "ssl_cert_file=/certs/tls.crt", "-c", "ssl_key_file=/certs/tls.key", "-c", "ssl_min_protocol_version=TLSv1.2", "-c", "hba_file=/etc/postgresql-hba/pg_hba.conf"]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "sh.secretName" . }}, key: DB_PASSWORD }
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /certs
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: hba
              mountPath: /etc/postgresql-hba
              readOnly: true
          securityContext: {{- include "sh.containerSecurity" . | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            periodSeconds: 5
            timeoutSeconds: 3
          resources: {{- toYaml .Values.postgres.incluster.resources | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: postgres-tls
            defaultMode: 0640
        - name: run
          emptyDir: {}
        - name: hba
          configMap:
            name: postgres-hba
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.incluster.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.incluster.size }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels: {{- include "sh.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app
                operator: In
                values: ["simple-host", "simple-host-owner-hosts", "simple-host-prune"]
      ports:
        - port: 5432
{{- end }}
{{- end }}
