{{- /*
The owner-hosts reconciler: one Ingress per owner with sites, annotated for
cert-manager, so each owner gets a *.<owner>.<host> certificate. The only pod
in the release with a Kubernetes token; its Role covers Ingresses and reading
Certificates in this namespace, nothing else.
*/ -}}
{{- if and (include "sh.configured" .) (eq .Values.certificates.ownerCerts "auto") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simple-host-owner-hosts
  labels: {{- include "sh.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: simple-host-owner-hosts
  labels: {{- include "sh.labels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: simple-host-owner-hosts
  labels: {{- include "sh.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: simple-host-owner-hosts
subjects:
  - kind: ServiceAccount
    name: simple-host-owner-hosts
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-host-owner-hosts
  labels:
    app: simple-host-owner-hosts
    {{- include "sh.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: simple-host-owner-hosts
  template:
    metadata:
      labels:
        app: simple-host-owner-hosts
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: simple-host-owner-hosts
      automountServiceAccountToken: true
      securityContext: {{- include "sh.podSecurity" . | nindent 8 }}
      {{- include "sh.scheduling" . | nindent 6 }}
      containers:
        - name: owner-hosts
          image: {{ include "sh.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["owner-hosts"]
          envFrom:
            - configMapRef:
                name: simple-host-config
          env:
            - name: DB_APP_USER
              value: simplehost_app
            - name: DB_APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "sh.secretName" . }}, key: DB_APP_PASSWORD }
          volumeMounts:
            - name: db-ca
              mountPath: /etc/simple-host/db-ca
              readOnly: true
          securityContext: {{- include "sh.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
      volumes:
        {{- include "sh.dbCAVolume" . | nindent 8 }}
{{- end }}
