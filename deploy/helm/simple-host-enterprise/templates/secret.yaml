{{- /*
Generated once and kept: helm upgrade reads the live Secret back, so a
password or key is never regenerated under a running install. Kept on
`helm uninstall` too, because the envelope key is the only way to read
the bucket; deleting the namespace deletes it.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $prev := dict }}
{{- with (lookup "v1" "Secret" .Release.Namespace "simple-host-secrets") }}{{ $prev = .data | default dict }}{{ end }}
{{- $keep := dict }}
{{- range $k, $v := $prev }}{{ $_ := set $keep $k ($v | b64dec) }}{{ end }}
{{- $session := $keep.SESSION_SIGNING_KEY | default (printf "k1:%s" (randBytes 32)) }}
{{- $dbPassword := .Values.postgres.password | default $keep.DB_PASSWORD | default (randAlphaNum 32) }}
{{- $appPassword := .Values.postgres.appPassword | default $keep.DB_APP_PASSWORD | default (randAlphaNum 32) }}
{{- if eq $dbPassword $appPassword }}{{ fail "postgres.password and postgres.appPassword must differ" }}{{ end }}
{{- $envelope := "" }}
{{- $storedEnvelope := $keep.BACKUP_ENVELOPE_KEY | default "" }}
{{- if eq .Values.storage.envelopeKey "-" }}
{{- if eq .Values.storage.sse "none" }}{{ fail "storage.envelopeKey \"-\" needs storage.sse AES256 or aws:kms: with none, the envelope is the only encryption" }}{{ end }}
{{- if $storedEnvelope }}{{ fail "storage.envelopeKey \"-\" would delete the envelope key this install already uses; every object written with it would become unreadable" }}{{ end }}
{{- else }}
{{- $envelope = .Values.storage.envelopeKey | default $storedEnvelope | default (printf "k1:%s" (randBytes 32)) }}
{{- /* A new key must keep the stored one after it (new,old), so objects written with the old key stay readable. */ -}}
{{- if and $storedEnvelope (ne $envelope $storedEnvelope) (not (has $storedEnvelope (splitList "," $envelope))) }}
{{- fail "storage.envelopeKey must keep the current key after the new one (\"<new>,<current>\"); read the current key with the command in the notes" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: simple-host-secrets
  labels: {{- include "sh.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- /* Keys added to the Secret by hand (SMTP_URL, DB_DSN) are kept. */ -}}
  {{- $managed := list "SESSION_SIGNING_KEY" "DB_PASSWORD" "DB_APP_PASSWORD" "OIDC_CLIENT_SECRET" "BACKUP_STORAGE_ACCESS_KEY_ID" "BACKUP_STORAGE_SECRET_ACCESS_KEY" "BACKUP_ENVELOPE_KEY" }}
  {{- range $k, $v := $keep }}
  {{- if and (not (has $k $managed)) (not (hasKey $.Values.extraSecrets $k)) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  SESSION_SIGNING_KEY: {{ $session | quote }}
  DB_PASSWORD: {{ $dbPassword | quote }}
  DB_APP_PASSWORD: {{ $appPassword | quote }}
  {{- with (.Values.oidc.clientSecret | default $keep.OIDC_CLIENT_SECRET) }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- $akid := .Values.storage.accessKeyId | default $keep.BACKUP_STORAGE_ACCESS_KEY_ID }}
  {{- $sak := .Values.storage.secretAccessKey | default $keep.BACKUP_STORAGE_SECRET_ACCESS_KEY }}
  {{- if and $akid $sak }}
  BACKUP_STORAGE_ACCESS_KEY_ID: {{ $akid | quote }}
  BACKUP_STORAGE_SECRET_ACCESS_KEY: {{ $sak | quote }}
  {{- end }}
  {{- if $envelope }}
  BACKUP_ENVELOPE_KEY: {{ $envelope | quote }}
  {{- end }}
  {{- range $k, $v := .Values.extraSecrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- if and (include "sh.configured" .) (not .Values.secrets.existingSecret) }}
{{- if not (.Values.oidc.clientSecret | default $keep.OIDC_CLIENT_SECRET) }}{{ fail "oidc.clientSecret is required" }}{{ end }}
{{- if and (contains "accounts.google.com" .Values.oidc.issuer) (not .Values.oidc.allowedEmailDomains) }}{{ fail "oidc.allowedEmailDomains is required with Google: without it any Google account can sign in" }}{{ end }}
{{- end }}
{{- end }}
{{- if and (eq .Values.postgres.mode "external") .Values.postgres.external.caCert }}
---
apiVersion: v1
kind: Secret
metadata:
  name: simple-host-db-ca
  labels: {{- include "sh.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: {{ .Values.postgres.external.caCert | quote }}
{{- end }}
