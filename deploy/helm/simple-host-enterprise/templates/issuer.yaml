{{- if and (include "sh.configured" .) .Values.certificates.createIssuer }}
{{- $acme := .Values.certificates.acme }}
{{- if not .Values.certificates.issuer }}{{ fail "certificates.issuer is required with certificates.createIssuer (the name of the ClusterIssuer to create)" }}{{ end }}
{{- if not $acme.email }}{{ fail "certificates.acme.email is required with certificates.createIssuer" }}{{ end }}
{{- if not (or $acme.digitaloceanToken $acme.digitaloceanTokenSecret) }}{{ fail "certificates.acme.digitaloceanToken (or digitaloceanTokenSecret) is required with certificates.createIssuer: the created issuer solves DNS-01 in DigitalOcean DNS" }}{{ end }}
{{- $tokenSecret := $acme.digitaloceanTokenSecret | default (printf "%s-digitalocean-dns" .Values.certificates.issuer) }}
{{- if $acme.digitaloceanToken }}
apiVersion: v1
kind: Secret
metadata:
  # ClusterIssuers read their Secrets from cert-manager's own namespace.
  name: {{ $tokenSecret }}
  namespace: {{ .Values.certificates.certManagerNamespace }}
  labels: {{- include "sh.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-token: {{ $acme.digitaloceanToken | quote }}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certificates.issuer }}
  labels: {{- include "sh.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ $acme.email | quote }}
    server: {{ $acme.server | quote }}
    privateKeySecretRef:
      name: {{ printf "%s-account" .Values.certificates.issuer }}
    solvers:
      # Only names under the host, so a Certificate elsewhere in the cluster
      # cannot use this token for another zone.
      - selector:
          dnsZones:
            - {{ .Values.host | quote }}
        dns01:
          digitalocean:
            tokenSecretRef:
              name: {{ $tokenSecret }}
              key: access-token
{{- end }}
