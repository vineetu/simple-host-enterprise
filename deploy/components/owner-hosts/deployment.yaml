apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-host-owner-hosts
  labels:
    app: simple-host-owner-hosts
spec:
  # One is enough: every pass is idempotent (server-side apply), and a
  # second replica would only repeat the same calls.
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: simple-host-owner-hosts
  template:
    metadata:
      labels:
        app: simple-host-owner-hosts
    spec:
      serviceAccountName: simple-host-owner-hosts
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: owner-hosts
          image: ghcr.io/vineetu/simple-host-enterprise
          args: ["owner-hosts"]
          envFrom:
            - configMapRef:
                name: simple-host-config
          env:
            # The application role, like the server: it reads owners and
            # writes owner_hosts, nothing else.
            - name: DB_APP_USER
              value: simplehost_app
            - name: DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: simple-host-secrets
                  key: DB_APP_PASSWORD
          volumeMounts:
            - name: db-ca
              mountPath: /etc/simple-host/db-ca
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
      volumes:
        - name: db-ca
          secret:
            secretName: simple-host-db-ca
            optional: true
