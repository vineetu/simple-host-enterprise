apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production is the byo shape with production values. Copy the byo .example files here
# as config.env / secrets.env / db-ca.crt and edit ingress-patch.yaml.
namespace: simple-host

resources:
  - ../../base

# The owner-hosts reconciler: one *.<owner>.<base> certificate per owner
# through cert-manager (OWNER_CERT_ISSUER in config.env). Leave it out and
# set OWNER_CERTS=manual if you issue owner certificates yourself.
components:
  - ../../components/owner-hosts

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: simple-host-config
    envs: [config.env]

secretGenerator:
  - name: simple-host-secrets
    envs: [secrets.env]
  - name: simple-host-db-ca
    files: [ca.crt=db-ca.crt]

images:
  - name: ghcr.io/vineetu/simple-host-enterprise
    newName: ghcr.io/vineetu/simple-host-enterprise
    digest: sha256:REPLACE_WITH_THE_SCANNED_IMAGE_DIGEST

patches:
  - path: ingress-patch.yaml
