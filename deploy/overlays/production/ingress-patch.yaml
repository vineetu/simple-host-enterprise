apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-host
  annotations:
    # --- Request body cap. Set the line for YOUR ingress controller.
    # Uploads are archives up to 100 MiB; a controller left at its own default
    # refuses them before the application is reached, and the failure reads as
    # an application bug. See deploy/overlays/byo/ingress-patch.yaml for the
    # per-controller table.
    nginx.ingress.kubernetes.io/proxy-body-size: 128m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # A wildcard certificate needs the DNS-01 solver; name the ClusterIssuer
    # the platform team configured for it.
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  # Whatever this cluster's IngressClass is actually called.
  ingressClassName: nginx
  tls:
    - hosts:
        - simple-host.example.com
        - "*.simple-host.example.com"
      secretName: simple-host-tls
  rules:
    - host: simple-host.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-host
                port:
                  name: http
    - host: "*.simple-host.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-host
                port:
                  name: http
