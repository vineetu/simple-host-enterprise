apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-host
  annotations:
    # `make local` installs ingress-nginx, so these are the right annotations
    # here. They live in the overlay rather than the base because a different
    # cluster runs a different controller, and an annotation meant for one
    # controller is silently ignored by another rather than refused.
    #
    # proxy-body-size is the one that matters: uploads are archives up to
    # 100 MiB, and ingress-nginx defaults to 1 MiB.
    nginx.ingress.kubernetes.io/proxy-body-size: 128m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - simple-host.127-0-0-1.nip.io
        - "*.simple-host.127-0-0-1.nip.io"
      # Created by `make local-certs` from the mkcert pair; not rendered here.
      secretName: simple-host-local-tls
  rules:
    - host: simple-host.127-0-0-1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-host
                port:
                  name: http
    - host: "*.simple-host.127-0-0-1.nip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-host
                port:
                  name: http
