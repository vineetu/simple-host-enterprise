apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The local cluster: Docker Desktop Kubernetes or minikube, with Postgres and
# MinIO in the cluster and a wildcard hostname that resolves to loopback
# without any DNS change. `make local` renders and applies this after it has
# installed ingress-nginx and cert-manager and loaded the mkcert certificate
# as simple-host-local-tls (see the Makefile; the CRDs those two ship must
# exist before the Certificate objects below can be applied).
namespace: simple-host

resources:
  - ../../base

components:
  - ../../components/postgres-incluster
  - ../../components/minio
  - ../../components/dex

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: simple-host-config
    envs: [config.env]

secretGenerator:
  - name: simple-host-secrets
    envs: [secrets.env]

images:
  - name: simple-host
    newName: simple-host
    newTag: local

patches:
  - path: ingress-patch.yaml
  - path: image-pull-patch.yaml
