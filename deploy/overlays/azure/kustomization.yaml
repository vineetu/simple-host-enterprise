apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AKS test overlay. Postgres, MinIO and Dex run in the cluster: this
# subscription cannot create a managed Postgres flexible server in any region,
# and Azure Blob Storage has no S3 API, so MinIO runs as a server rather than
# as a translation layer in front of Blob.
namespace: simple-host

resources:
  - ../../base

components:
  - ../../components/postgres-incluster
  - ../../components/minio
  - ../../components/dex

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: simple-host-config
    envs: [config.env]

secretGenerator:
  - name: simple-host-secrets
    envs: [secrets.env]

images:
  - name: simple-host
    newName: shentacr3333.azurecr.io/simple-host
    digest: sha256:7b2a275d3bbb1158b1a7df30e8d5a8bb95e176dae10b826e259e52bff2e618ca

patches:
  - path: ingress-patch.yaml
  - path: pull-secret-patch.yaml
