# The pull secret goes on the ServiceAccount, not on the Deployment. Two
# workloads run this image — the server and the prune CronJob — and both
# need to pull it. Patching the Deployment alone leaves the CronJob in
# ImagePullBackOff, which is silent: the instance serves fine while retention
# never runs at all.
#
# Kubernetes applies a ServiceAccount's imagePullSecrets to every pod that
# uses it, so this covers both and anything added later.
#
# (Contributor cannot create role assignments, so `az aks update --attach-acr`
# is unavailable — it grants AcrPull to the kubelet identity and needs User
# Access Administrator. A pull secret does the same job with the permissions
# we have.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simple-host
imagePullSecrets:
  - name: acr-pull
